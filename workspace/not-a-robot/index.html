<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我不是机器人</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: #333;
}
.container {
  background: white;
  border-radius: 20px;
  padding: 40px;
  width: 420px;
  max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  text-align: center;
}
.title svg { width: 280px; margin-bottom: 24px; }
.level-badge {
  background: #e8e8ff;
  color: #5555cc;
  font-size: 13px;
  font-weight: 600;
  padding: 4px 14px;
  border-radius: 20px;
  display: inline-block;
  margin-bottom: 16px;
}
.prompt {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 20px;
  min-height: 28px;
}
.sub-prompt {
  font-size: 14px;
  color: #888;
  margin-bottom: 20px;
  min-height: 20px;
}
/* Checkbox level */
.checkbox-area {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100px;
}
.checkbox-big {
  width: 60px;
  height: 60px;
  border: 3px solid #ccc;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  transition: 0.15s;
  user-select: none;
  position: relative;
}
.checkbox-big:hover { border-color: #999; }
.checkbox-big.checked {
  background: #4caf50;
  border-color: #4caf50;
  color: white;
}
.checkbox-big.shake {
  animation: shake 0.3s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  50% { transform: translateX(10px); }
  75% { transform: translateX(-10px); }
}
/* Image grid */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.grid-item {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 3px solid #ddd;
  cursor: pointer;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  transition: 0.15s;
  background: #f5f5f5;
}
.grid-item:hover { border-color: #aaa; }
.grid-item.selected { border-color: #4caf50; background: #e8f5e9; }
.grid-item.wrong { border-color: #f44336; background: #ffebee; animation: shake 0.3s; }
/* Slider */
.slider-container {
  padding: 10px 0;
  margin-bottom: 12px;
}
.slider-track {
  width: 100%;
  height: 40px;
  background: #e0e0e0;
  border-radius: 20px;
  position: relative;
  cursor: pointer;
  overflow: hidden;
}
.slider-fill {
  height: 100%;
  background: #4caf50;
  border-radius: 20px;
  width: 0%;
  transition: 0.05s;
}
.slider-thumb {
  width: 44px;
  height: 44px;
  background: white;
  border: 2px solid #ccc;
  border-radius: 50%;
  position: absolute;
  top: -2px;
  left: 0;
  cursor: grab;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  user-select: none;
  z-index: 2;
  transition: none;
}
.slider-thumb:active { cursor: grabbing; }
.slider-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 13px;
  color: #666;
  z-index: 1;
  pointer-events: none;
}
/* Text input */
.text-input {
  width: 100%;
  padding: 12px 16px;
  font-size: 20px;
  border: 2px solid #ddd;
  border-radius: 10px;
  outline: none;
  text-align: center;
  font-family: 'Courier New', monospace;
  letter-spacing: 4px;
  margin-bottom: 12px;
}
.text-input:focus { border-color: #5555cc; }
.distorted-text {
  font-size: 32px;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  margin-bottom: 12px;
  letter-spacing: 6px;
  user-select: none;
  background: #f5f5f5;
  padding: 16px;
  border-radius: 10px;
  display: inline-block;
}
.distorted-text span {
  display: inline-block;
}
/* Audio level */
.audio-btn {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #5555cc;
  color: white;
  border: none;
  font-size: 36px;
  cursor: pointer;
  margin-bottom: 16px;
  transition: 0.15s;
}
.audio-btn:hover { background: #4444bb; transform: scale(1.05); }
.audio-btn:active { transform: scale(0.95); }
/* Buttons */
.btn-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 16px;
}
.btn {
  padding: 10px 28px;
  border-radius: 8px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.15s;
}
.btn-primary {
  background: #5555cc;
  color: white;
}
.btn-primary:hover { background: #4444bb; }
.btn-primary:disabled {
  background: #ccc;
  cursor: not-allowed;
}
.btn-secondary {
  background: #f0f0f0;
  color: #666;
}
.btn-secondary:hover { background: #e0e0e0; }
/* Result */
.result-icon {
  font-size: 80px;
  margin-bottom: 16px;
}
.result-text {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 8px;
}
.result-sub {
  font-size: 14px;
  color: #888;
  margin-bottom: 20px;
}
.fail-reason {
  font-size: 13px;
  color: #f44336;
  margin-top: 8px;
  min-height: 20px;
}
.hidden { display: none; }
/* Confetti */
.confetti-piece {
  position: fixed;
  width: 10px;
  height: 10px;
  top: -10px;
  animation: fall linear forwards;
  pointer-events: none;
  z-index: 999;
}
@keyframes fall {
  to { top: 110vh; transform: rotate(720deg); }
}
</style>
</head>
<body>

<div class="container" id="app">
  <div class="title">
    <svg viewBox="0 0 280 50" width="280">
      <text x="50%" y="35" font-size="22" font-weight="700" fill="#333" text-anchor="middle" font-family="system-ui">我不是机器人</text>
    </svg>
  </div>

  <div id="level-display">
    <div class="level-badge" id="level-label">Level 1: 复选框</div>
    <div class="prompt" id="prompt">请确认你不是机器人</div>
    <div class="sub-prompt" id="sub-prompt">勾选下方的复选框</div>
  </div>

  <div id="content-area"></div>

  <div class="fail-reason" id="fail-reason"></div>

  <div class="btn-row" id="btn-row">
    <button class="btn btn-secondary" id="reset-btn" onclick="resetGame()">重新开始</button>
  </div>
</div>

<script>
let level = 0;
let sliderDragging = false;
let sliderStartX = 0;
let sliderThumbLeft = 0;
let clickCount = 0;
let selectedImages = [];
let imagePhase = 0;
let audioPlayed = false;
let audioCtx = null;

const emojiPool = ['🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥝','🍌','🍉','🍍','🥭'];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function rng(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

const levelConfigs = [
  {
    label: 'Level 1: 复选框',
    prompt: '请确认你不是机器人',
    sub: '勾选下方的复选框',
    render: function(area) {
      area.innerHTML = `
        <div class="checkbox-area">
          <div class="checkbox-big" id="checkbox">⬜</div>
        </div>
      `;
      const cb = document.getElementById('checkbox');
      let counter = 0;
      const phrases = [
        '再点一次', '你没点中', '用力点！', '感觉不太像人类呢',
        '再来一次', '你是不是机器人？', '严肃点！', '还差一点',
        '你到底是不是人？', '我怀疑你了', '认真的吗？', '好吧再来一次'
      ];
      const maxTimes = 8 + rng(0, 5);
      cb.onclick = function(e) {
        counter++;
        if (counter < maxTimes) {
          cb.classList.add('shake');
          setTimeout(() => cb.classList.remove('shake'), 300);
          showSub(phrases[counter % phrases.length]);
          if (counter === maxTimes - 1) showSub('最后一次！真的！');
        } else if (counter === maxTimes) {
          cb.textContent = '✅';
          cb.classList.add('checked');
          showSub('好吧，你通过了...暂时');
          setTimeout(() => nextLevel(), 800);
        }
      };
    }
  },
  {
    label: 'Level 2: 图片识别',
    prompt: '请点击所有包含水果的图片',
    sub: '仔细看哦～',
    render: function(area) {
      const items = [];
      const fruits = ['🍎','🍊','🍋','🍇','🍓'];
      const notFruits = ['🚗','🏠','📚','💻','🎮','🔫','👟','🧦','🛁','🔪','📦','🎯'];
      shuffle(notFruits);
      for (let i = 0; i < 3; i++) items.push(fruits[i]);
      for (let i = 0; i < 6; i++) items.push(notFruits[i]);
      shuffle(items);
      selectedImages = [];
      area.innerHTML = `
        <div class="grid" id="grid"></div>
        <button class="btn btn-primary" id="verify-btn" disabled>验证</button>
      `;
      const grid = document.getElementById('grid');
      items.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'grid-item';
        div.dataset.index = idx;
        div.dataset.value = item;
        div.textContent = item;
        div.onclick = function() {
          if (this.classList.contains('selected')) {
            this.classList.remove('selected');
            selectedImages = selectedImages.filter(i => i !== idx);
          } else {
            this.classList.add('selected');
            selectedImages.push(idx);
          }
          document.getElementById('verify-btn').disabled = selectedImages.length === 0;
        };
        grid.appendChild(div);
      });
      document.getElementById('verify-btn').onclick = function() {
        const selected = selectedImages.map(i => items[i]);
        const hasNonFruit = selected.some(v => !['🍎','🍊','🍋','🍇','🍓'].includes(v));
        if (hasNonFruit || selectedImages.length !== 3) {
          showSub('选错了！再仔细看看哪些是水果？');
          document.querySelectorAll('.grid-item.selected').forEach(el => {
            el.classList.remove('selected');
            el.classList.add('wrong');
            setTimeout(() => el.classList.remove('wrong'), 500);
          });
          selectedImages = [];
          this.disabled = true;
        } else {
          showSub('正确！你认得水果');
          setTimeout(() => nextLevel(), 600);
        }
      };
    }
  },
  {
    label: 'Level 3: 滑动验证',
    prompt: '将滑块拖到最右边完成验证',
    sub: '按住滑块向右拖动',
    render: function(area) {
      area.innerHTML = `
        <div class="slider-container">
          <div class="slider-track" id="slider-track">
            <div class="slider-fill" id="slider-fill"></div>
            <div class="slider-thumb" id="slider-thumb">→</div>
            <div class="slider-text" id="slider-text">拖动滑块验证</div>
          </div>
        </div>
      `;
      const track = document.getElementById('slider-track');
      const thumb = document.getElementById('slider-thumb');
      const fill = document.getElementById('slider-fill');
      const stext = document.getElementById('slider-text');
      let completed = false;
      let attempts = 0;
      let snapCount = 0;
      const snapTimes = 2 + rng(0, 3);

      function onMove(clientX) {
        if (completed) return;
        const rect = track.getBoundingClientRect();
        let x = Math.max(0, Math.min(clientX - rect.left - 22, rect.width - 44));
        const pct = (x / (rect.width - 44)) * 100;
        thumb.style.left = x + 'px';
        fill.style.width = pct + '%';
        if (pct >= 98) {
          attempts++;
          if (attempts < 3) {
            snapCount++;
            showSub(`就差一点！再试一次 (${snapCount}/${snapTimes})`);
            x = Math.max(0, x - 60 - rng(0, 40));
            thumb.style.left = x + 'px';
            fill.style.width = (x / (rect.width - 44)) * 100 + '%';
          } else if (attempts < 3 + snapTimes) {
            showSub('还不行，再来！');
            x = 0;
            thumb.style.left = '0px';
            fill.style.width = '0%';
          } else {
            completed = true;
            thumb.textContent = '✅';
            thumb.style.left = (rect.width - 44) + 'px';
            fill.style.width = '100%';
            stext.textContent = '验证通过！';
            showSub('你赢了，虽然很艰难');
            setTimeout(() => nextLevel(), 800);
          }
        }
      }

      thumb.addEventListener('mousedown', function(e) {
        e.preventDefault();
        sliderDragging = true;
      });
      document.addEventListener('mousemove', function(e) {
        if (sliderDragging && !completed) onMove(e.clientX);
      });
      document.addEventListener('mouseup', function() {
        sliderDragging = false;
        if (!completed) {
          const rect = track.getBoundingClientRect();
          const left = parseInt(thumb.style.left) || 0;
          const pct = (left / (rect.width - 44)) * 100;
          if (pct < 98) {
            showSub('松手太早了！继续拖！');
          }
        }
      });
      thumb.addEventListener('touchstart', function(e) {
        e.preventDefault();
        sliderDragging = true;
      }, {passive: false});
      document.addEventListener('touchmove', function(e) {
        if (sliderDragging && !completed) onMove(e.touches[0].clientX);
      }, {passive: false});
      document.addEventListener('touchend', function() {
        sliderDragging = false;
      });
    }
  },
  {
    label: 'Level 4: 文字识别',
    prompt: '请输入你看到的验证码',
    sub: '区分大小写哦',
    render: function(area) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) code += chars[rng(0, chars.length - 1)];
      const spans = code.split('').map(c => {
        const rot = rng(-25, 25);
        const size = rng(26, 38);
        const color = ['#333','#555','#c0392b','#2980b9','#8e44ad','#27ae60'][rng(0, 5)];
        const offsetY = rng(-6, 6);
        return `<span style="transform:rotate(${rot}deg);font-size:${size}px;color:${color};position:relative;top:${offsetY}px">${c}</span>`;
      }).join('');
      area.innerHTML = `
        <div class="distorted-text">${spans}</div>
        <input type="text" class="text-input" id="captcha-input" placeholder="输入验证码" autocomplete="off" maxlength="6">
        <button class="btn btn-primary" id="captcha-btn">验证</button>
      `;
      let attempts = 0;
      document.getElementById('captcha-btn').onclick = function() {
        const val = document.getElementById('captcha-input').value.toUpperCase();
        if (val === code) {
          showSub('正确！你眼睛真好');
          setTimeout(() => nextLevel(), 600);
        } else {
          attempts++;
          if (attempts >= 3) {
            code = code.split('').sort(() => Math.random() - 0.5).join('');
            document.querySelector('.distorted-text').innerHTML = code.split('').map(c => {
              return `<span style="transform:rotate(${rng(-30,30)}deg);font-size:${rng(24,36)}px;color:#${Math.floor(Math.random()*16777215).toString(16)};position:relative;top:${rng(-8,8)}px">${c}</span>`;
            }).join('');
            showSub('答错太多，换了一个验证码！');
          } else {
            showSub(`不对哦，还剩${3-attempts}次机会`);
          }
          document.getElementById('captcha-input').value = '';
        }
      };
      document.getElementById('captcha-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('captcha-btn').click();
      });
    }
  },
  {
    label: 'Level 5: 最终审核',
    prompt: '正在审核你的身份...',
    sub: '请耐心等待',
    render: function(area) {
      let dots = 0;
      area.innerHTML = `
        <div style="padding:40px 0">
          <div style="font-size:60px;margin-bottom:16px">🤖🔍</div>
          <div style="font-size:16px;color:#666">正在分析你的行为模式...</div>
          <div style="font-size:14px;color:#999;margin-top:8px" id="analyzing-text">检测中<span id="dots"></span></div>
        </div>
      `;
      const dotEl = document.getElementById('dots');
      const analyzingText = document.getElementById('analyzing-text');
      const interval = setInterval(() => {
        dots++;
        dotEl.textContent = '.'.repeat((dots % 6) + 1);
        if (dots === 4) analyzingText.textContent = '检查鼠标移动轨迹...';
        if (dots === 8) analyzingText.textContent = '分析点击模式...';
        if (dots === 12) analyzingText.textContent = '比对人类数据库...';
        if (dots === 16) analyzingText.textContent = '扫描瞳孔特征...';
        if (dots === 20) analyzingText.textContent = '检测体温...';
        if (dots === 24) analyzingText.textContent = '差不多了...';
        if (dots === 28) {
          clearInterval(interval);
          area.innerHTML = `
            <div style="padding:30px 0">
              <div class="result-icon">🎉</div>
              <div class="result-text">验证通过！你可能是人类</div>
              <div class="result-sub">但也可能是很聪明的机器人...</div>
              <div style="font-size:13px;color:#aaa;margin-top:8px">
                用时 ${Math.floor((Date.now() - startTime) / 1000)} 秒 | 
                失败次数 ${failCount} 次
              </div>
              <button class="btn btn-primary" style="margin-top:20px" onclick="resetGame()">再玩一次</button>
            </div>
          `;
          launchConfetti();
        }
      }, 400);
    }
  }
];

let startTime = 0;
let failCount = 0;

function showSub(text) {
  document.getElementById('sub-prompt').textContent = text;
}

function nextLevel() {
  level++;
  if (level >= levelConfigs.length) return;
  renderLevel();
}

function renderLevel() {
  const cfg = levelConfigs[level];
  document.getElementById('level-label').textContent = cfg.label;
  document.getElementById('prompt').textContent = cfg.prompt;
  document.getElementById('sub-prompt').textContent = cfg.sub;
  document.getElementById('fail-reason').textContent = '';
  const area = document.getElementById('content-area');
  area.innerHTML = '';
  cfg.render(area);
}

function resetGame() {
  level = 0;
  startTime = Date.now();
  failCount = 0;
  renderLevel();
}

function launchConfetti() {
  const colors = ['#f44336','#e91e63','#9c27b0','#3f51b5','#03a9f4','#009688','#8bc34a','#ffeb3b','#ff9800','#ff5722'];
  for (let i = 0; i < 100; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = rng(6, 12) + 'px';
    el.style.height = rng(6, 12) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    el.style.animationDuration = (2 + Math.random() * 3) + 's';
    el.style.animationDelay = Math.random() * 2 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }
}

// Fix typo in level 3
let _thumb = null;
// We'll just use a direct reference

// init
startTime = Date.now();
renderLevel();

// Fix the thumb reference issue in level 3 by overriding on the fly
</script>

</body>
</html>
