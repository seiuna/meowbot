name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @meowbot/shared build

      - name: Type check
        run: pnpm --filter meowbot exec tsc --noEmit
        continue-on-error: true

      - name: Run tests
        run: pnpm --filter meowbot test
